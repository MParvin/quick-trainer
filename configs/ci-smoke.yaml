# Minimal config for GitHub Actions smoke runs (CPU, tiny sample count).
# Replace hf repo id and enable upload when secrets are configured.

base_model: gpt2

datasets:
  - path: rotten_tomatoes
    split: train
    text_field: text
    max_samples: 32

training:
  output_dir: ./output
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  max_seq_length: 128
  use_lora: true
  load_in_4bit: false
  bf16: false
  logging_steps: 5
  save_steps: 50
  lora:
    r: 8
    lora_alpha: 16

huggingface:
  enabled: false
  repo_id: your-username/quick-trainer-ci-model

ollama:
  enabled: false
