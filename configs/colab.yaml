# Quick Trainer configuration for Google Colab (GPU).
# Edit huggingface.repo_id before training.
#
# Default model is ungated so Colab works without extra HF approvals.
# For gated models (e.g. meta-llama/Llama-3.2-1B-Instruct), accept the license
# on the model's Hugging Face page while logged in, then set base_model below.

base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0

datasets:
  - path: databricks/databricks-dolly-15k
    split: train
    instruction_field: instruction
    response_field: response
    max_samples: 500  # remove or increase for full training

training:
  output_dir: /content/output
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 512
  use_lora: true
  load_in_4bit: true
  bf16: true
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05

huggingface:
  enabled: true
  repo_id: your-username/my-colab-model
  private: false
  commit_message: "Fine-tuned with Quick Trainer on Colab"

ollama:
  enabled: false
