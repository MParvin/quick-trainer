# Quick Trainer example configuration
# Copy to config.yaml and adjust values for your run.

base_model: meta-llama/Llama-3.2-1B-Instruct

datasets:
  - path: databricks/databricks-dolly-15k
    split: train
    instruction_field: instruction
    response_field: response
    max_samples: 500  # remove or increase for full training

  # Local JSON/JSONL also works:
  # - path: ./data/my_examples.jsonl
  #   text_field: text

training:
  output_dir: ./output
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 512
  use_lora: true
  load_in_4bit: true
  bf16: true
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05

huggingface:
  enabled: true
  repo_id: your-username/my-quick-trainer-model
  private: false
  commit_message: "Fine-tuned with Quick Trainer"

ollama:
  enabled: false
  model_name: my-quick-trainer-model
  system_prompt: "You are a helpful assistant."
  push: false

# Prefer HF_TOKEN environment variable over inline tokens.
# hf_token: hf_...
