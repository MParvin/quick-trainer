name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (CPU CI deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"

      - name: Ruff
        run: ruff check quick_trainer tests

      - name: Pytest
        run: pytest -q
