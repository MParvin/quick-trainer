name: Train and Push Model

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to training config YAML in the repo
        required: true
        default: configs/golang-dev.yaml
        type: string
      skip_download:
        description: Skip explicit model pre-download
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - main
    paths:
      - "configs/**"
      - "quick_trainer/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/train-and-push.yml"

env:
  IMAGE: mparvin/quick-trainer:latest

jobs:
  train-and-push:
    runs-on: [self-hosted, gpu]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate config
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -v quick-trainer-hf-cache:/root/.cache/huggingface \
            -w /workspace \
            ${{ env.IMAGE }} \
            validate "${{ github.event.inputs.config_path || 'configs/golang-dev.yaml' }}"

      - name: Train and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          CONFIG="${{ github.event.inputs.config_path || 'configs/golang-dev.yaml' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.skip_download }}" = "true" ]; then
            EXTRA="--skip-download"
          fi
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -v quick-trainer-hf-cache:/root/.cache/huggingface \
            -w /workspace \
            -e HF_TOKEN \
            -e HUGGING_FACE_HUB_TOKEN \
            -e OLLAMA_HOST \
            ${{ env.IMAGE }} \
            train --config "$CONFIG" $EXTRA

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-trainer-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14
