name: Train and Push Model

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to training config YAML in the repo
        required: true
        default: configs/golang-dev.yaml
        type: string
      skip_download:
        description: Skip explicit model pre-download
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - main
    paths:
      - "configs/**"
      - "quick_trainer/**"
      - "pyproject.toml"
      - ".github/workflows/train-and-push.yml"

jobs:
  train-and-push:
    runs-on: [self-hosted, gpu]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify system Python
        run: |
          python3 --version
          python3 -m pip --version
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          PYTHON_MAJOR="$(python3 -c 'import sys; print(sys.version_info.major)')"
          PYTHON_MINOR="$(python3 -c 'import sys; print(sys.version_info.minor)')"
          if [ "$PYTHON_MAJOR" -lt 3 ] || { [ "$PYTHON_MAJOR" -eq 3 ] && [ "$PYTHON_MINOR" -lt 10 ]; }; then
            echo "Python >= 3.10 is required (found ${PYTHON_VERSION})"
            exit 1
          fi
          echo "Using system Python ${PYTHON_VERSION}"

      - name: Install CUDA PyTorch
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu124

      - name: Install Quick Trainer
        run: python3 -m pip install -e .

      - name: Validate config
        run: quick-trainer validate "${{ github.event.inputs.config_path || 'configs/golang-dev.yaml' }}"

      - name: Train and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          CONFIG="${{ github.event.inputs.config_path || 'configs/golang-dev.yaml' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.skip_download }}" = "true" ]; then
            EXTRA="--skip-download"
          fi
          quick-trainer train --config "$CONFIG" $EXTRA

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-trainer-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14

  # Optional smoke job for GitHub-hosted runners (uses setup-python on Ubuntu).
  train-and-push-hosted:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Quick Trainer
        run: pip install -e .

      - name: Validate config
        run: quick-trainer validate configs/ci-smoke.yaml

      - name: Train and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: quick-trainer train --config configs/ci-smoke.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: quick-trainer-output-hosted
          path: output/
          if-no-files-found: ignore
