version: "3"

vars:
  IMAGE: mparvin/quick-trainer
  TAG: latest
  CONFIG: configs/ci-smoke.yaml
  SKIP_DOWNLOAD: "false"
  SERVER: devmad
  DEP_PATH: /opt/src/quick-trainer

tasks:
  docker:build:
    desc: Build the Quick Trainer Docker image
    cmds:
      - docker build -t {{.IMAGE}}:{{.TAG}} .

  docker:push:
    desc: Push the image to Docker Hub (run docker login first)
    cmds:
      - docker push {{.IMAGE}}:{{.TAG}}

  docker:publish:
    desc: Build and push the Docker image to Docker Hub
    deps: [docker:build]
    cmds:
      - task: docker:push

  binary:
    desc: Build a standalone quick-trainer executable (output dist/quick-trainer)
    cmds:
      - |
        if [ ! -x .venv/bin/python3 ]; then
          python3 -m venv .venv
        fi
        .venv/bin/python3 -m pip install -e ".[dev,cpu]"
        .venv/bin/python3 -m PyInstaller --clean --noconfirm quick-trainer.spec
        chmod +x dist/quick-trainer
        dist/quick-trainer --help

  train:
    desc: "Fine-tune a model locally (usage: task train CONFIG=configs/golang-dev.yaml)"
    cmds:
      - |
        EXTRA=()
        if [ "{{.SKIP_DOWNLOAD}}" = "true" ]; then
          EXTRA+=(--skip-download)
        fi
        docker run --rm --gpus all \
          -v "$(pwd):/workspace" \
          -v quick-trainer-hf-cache:/workspace/.cache/huggingface \
          -w /workspace \
          -u "$(id -u):$(id -g)" \
          -e HF_TOKEN \
          -e HUGGING_FACE_HUB_TOKEN \
          -e OLLAMA_HOST \
          -e HOME=/workspace \
          -e HF_HOME=/workspace/.cache/huggingface \
          {{.IMAGE}}:{{.TAG}} \
          validate --require-repo-path {{.CONFIG}}
        docker run --rm --gpus all \
          -v "$(pwd):/workspace" \
          -v quick-trainer-hf-cache:/workspace/.cache/huggingface \
          -w /workspace \
          -u "$(id -u):$(id -g)" \
          -e HF_TOKEN \
          -e HUGGING_FACE_HUB_TOKEN \
          -e OLLAMA_HOST \
          -e HOME=/workspace \
          -e HF_HOME=/workspace/.cache/huggingface \
          {{.IMAGE}}:{{.TAG}} \
          train --config {{.CONFIG}} "${EXTRA[@]}"

  remote:build:
    desc: Build the Docker image on a remote server
    cmds:
      - ssh {{.SERVER}} "mkdir -p {{.DEP_PATH}}"
      - rsync -avz --exclude .git --exclude dist --exclude .venv ./ {{.SERVER}}:{{.DEP_PATH}}
      - ssh {{.SERVER}} "cd {{.DEP_PATH}} && task binary"
      - scp {{.SERVER}}:{{.DEP_PATH}}/dist/quick-trainer ./dist/quick-trainer
